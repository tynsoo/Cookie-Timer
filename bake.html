<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baking Timer</title>
  <link href="fonts/fonts.css" rel="stylesheet">
  <script>
    // Apply the saved theme before the page paints, so dark mode never flashes light.
    (function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem('cookieTimer.settings')) || {}; } catch (e) {}
      var dark = s.theme ? s.theme === 'dark'
        : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    /* Colors picked from the hand-drawn buttons */
    --cream: #e8e2cd;
    --rose: #b25959;
    --rose-dark: #873a3a;
    --rose-light: #cb9990;
    --timer-text: #ffe69c;
    --pixel: 3px;            /* one art pixel on screen */
  }

  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Silkscreen', monospace;
    overflow-x: hidden;
  }

  img {
    image-rendering: pixelated;
  }

  .hidden {
    display: none !important;
  }

/* ==================== BAKE SCREEN ==================== */

#bake-screen {
  position: relative;
  width: 100%;
  min-height: 100vh;
  padding: 0 16px 48px;
  color: var(--rose);
}

/* Tablecloth on its own fixed layer (background-attachment: fixed misbehaves on phones) */
#bg {
  position: fixed;
  inset: 0;
  background-color: #8b4545;
  background-image: url('images/background_2.png');
  background-size: cover;
  background-position: center;
  image-rendering: pixelated;
  z-index: 0;
}

/* Dark mode: dim the tablecloth without redrawing it */
#bake-screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(20, 8, 12, 0.62);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 1;
}

html.dark #bake-screen::before {
  opacity: 1;
}

#bake-screen > *:not(#bg) {
  position: relative;
  z-index: 1;
}

html.dark #bake-screen img,
html.dark .frame:not(.selected):not(.timer-frame) {
  filter: brightness(0.85);
}

/* ==================== PIXEL FRAMES ==================== */
/* Any width of button or panel, drawn from the same edges as start.png */

.frame {
  border-style: solid;
  border-width: 12px 15px 21px 15px;
  border-image: url('buttons/icons/frame-cream.png') 12 15 21 15 fill / 12px 15px 21px 15px;
  image-rendering: pixelated;
  background: none;
}

.frame.selected {
  border-image-source: url('buttons/icons/frame-selected.png');
  color: var(--cream);
}

.frame.timer-frame {
  border-image-source: url('buttons/icons/frame-timer.png');
  color: var(--timer-text);
}

/* ==================== BUTTONS ==================== */

.icon-btn,
.img-btn {
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  line-height: 0;
  transition: transform 0.2s ease;
}

.icon-btn img {
  width: calc(17 * var(--pixel));
  height: calc(16 * var(--pixel));
}

.icon-btn.small img {
  width: calc(17 * 2px);
  height: calc(16 * 2px);
}

.icon-btn:hover:not(:disabled),
.img-btn:hover:not(:disabled),
.text-btn:hover:not(:disabled) {
  transform: scale(1.1);
}

.icon-btn:active:not(:disabled),
.img-btn:active:not(:disabled),
.text-btn:active:not(:disabled) {
  transform: translateY(2px);
}

.icon-btn:disabled,
.text-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.icon-btn:focus-visible,
.img-btn:focus-visible,
.text-btn:focus-visible {
  outline: 3px dashed var(--timer-text);
  outline-offset: 2px;
}

.text-btn {
  font-family: 'Silkscreen', monospace;
  font-size: 16px;
  letter-spacing: 0;
  text-transform: uppercase;
  color: var(--rose);
  cursor: pointer;
  padding: 0 4px;
  min-height: 0;
  line-height: 1.2;
  white-space: nowrap;
  transition: transform 0.2s ease;
}

/* ==================== TOP BAR ==================== */

#top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 0 0;
}

#backBtn img {
  width: 130px;
  height: auto;
}

#settings-bar {
  display: flex;
  gap: 8px;
}

/* ==================== LAYOUT ==================== */

#layout {
  display: grid;
  grid-template-columns: 1fr;
  justify-items: center;
  gap: 24px;
  max-width: 1200px;
  margin: 0 auto;
}

@media screen and (min-width: 1100px) {
  #layout {
    grid-template-columns: 1fr minmax(0, 720px) 1fr;
    align-items: start;
  }

  #oven { grid-column: 2; }

  #trays {
    grid-column: 3;
    grid-row: 1;
    justify-self: end;
    width: 100%;
    max-width: 290px;
    margin-top: 24px;
  }
}

#oven {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ==================== COOKIE ==================== */

#cookie-container {
  width: 100%;
  height: clamp(190px, 33vh, 320px);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

#cookie-dough {
  width: clamp(150px, 20vh, 210px);
  height: auto;
  transition: transform 0.2s ease;
}

#cookie-dough:hover {
  transform: scale(1.05);
}

#cookie-baking {
  width: clamp(200px, 36vh, 340px);
  height: clamp(200px, 36vh, 340px);
}

#cookie-done {
  width: min(440px, 88vw);
  max-height: 100%;
  object-fit: contain;
}

/* ==================== TIMER ==================== */

#timer-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

#done,
#timer {
  font-size: 64px;
  line-height: 1;
  letter-spacing: 0;
  padding: 6px 22px 0;
  font-variant-numeric: tabular-nums;
  text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.25);
}

#timer.paused {
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  50% { opacity: 0.4; }
}

#status {
  font-size: 16px;
  letter-spacing: 0;
  text-transform: uppercase;
  padding: 0 8px;
}

/* ==================== CONTROLS ==================== */

.controls {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin-top: 14px;
}

#bakeStart img,
#bakeEnd img {
  width: clamp(120px, 14vw, 190px);
  height: auto;
}

/* ==================== PANELS ==================== */

.panel-title {
  font-size: 16px;
  letter-spacing: 0;
  text-transform: uppercase;
  color: var(--rose-dark);
  margin-bottom: 10px;
  text-align: center;
}

/* ==================== PRESETS ==================== */

#presets-panel {
  margin-top: 18px;
  width: min(720px, 100%);
  padding: 4px 6px 2px;
}

#presets {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 8px 10px;
}

.preset {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}

#custom-form {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

#custom-form input {
  font-family: 'Silkscreen', monospace;
  font-size: 16px;
  color: var(--rose-dark);
  background: rgba(255, 255, 255, 0.5);
  border: 3px solid var(--rose);
  border-bottom-width: 5px;
  border-radius: 0;
  padding: 4px 6px;
}

#custom-form input:focus {
  outline: none;
  border-color: var(--rose-dark);
}

#custom-form input[type="number"] {
  width: 64px;
}

#custom-form input[type="text"] {
  width: 190px;
}

#custom-error {
  width: 100%;
  text-align: center;
  font-size: 16px;
  color: var(--rose-dark);
}

/* ==================== EXTRA TRAYS (multiple timers) ==================== */

#trays {
  width: min(320px, 100%);
  padding: 4px 4px 2px;
}

#tray-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 10px;
}

#tray-list:empty {
  display: none;
}

#tray-empty {
  font-size: 16px;
  text-align: center;
  margin-bottom: 10px;
  color: var(--rose);
}

.tray {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 8px;
  align-items: center;
  padding: 8px;
  border: 3px dashed var(--rose-light);
}

.tray.is-done {
  border-style: solid;
  border-color: var(--rose);
  background: rgba(255, 230, 156, 0.5);
  animation: wiggle 0.6s steps(2) 4;
}

@keyframes wiggle {
  50% { transform: translateX(3px); }
}

.tray-name {
  grid-column: 1 / -1;
  font-size: 16px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tray-time {
  font-size: 24px;
  line-height: 1;
  padding: 2px 4px 0;
  text-align: center;
  min-width: 100px;
  font-variant-numeric: tabular-nums;
}

.tray-actions {
  display: flex;
  justify-content: flex-end;
  gap: 6px;
}

#addTray {
  display: block;
  margin: 0 auto;
}

/* ==================== MEDIA QUERIES ==================== */

@media screen and (max-height: 760px) and (min-width: 769px) {
  #done, #timer { font-size: 56px; }
  #cookie-container { height: clamp(180px, 32vh, 300px); }
}

@media screen and (max-width: 768px) {
  :root { --pixel: 2px; }

  #backBtn img { width: 100px; }

  #done,
  #timer {
    font-size: 48px;
  }

  .controls { gap: 16px; }

  #bakeStart img,
  #bakeEnd img {
    width: 120px;
  }
}

@media screen and (max-width: 480px) {
  #bake-screen { padding: 0 10px 40px; }

  #bakeStart img,
  #bakeEnd img {
    width: 110px;
  }

  .text-btn { font-size: 16px; letter-spacing: 0; }
}

</style>

<body>

  <div id="bake-screen">
    <div id="bg" aria-hidden="true"></div>

    <header id="top-bar">
      <button id="backBtn" class="img-btn" type="button" aria-label="Back to start">
        <img src="buttons/back.png" alt="Back">
      </button>

      <div id="settings-bar">
        <button id="soundToggle" class="icon-btn" type="button"><img alt=""></button>
        <button id="notifyToggle" class="icon-btn" type="button"><img alt=""></button>
        <button id="themeToggle" class="icon-btn" type="button"><img alt=""></button>
      </div>
    </header>

    <main id="layout">
      <section id="oven">
        <div id="cookie-container">
          <img id="cookie-dough" src="images/cookie_1.png" alt="Cookie Dough">
          <img id="cookie-baking" src="images/cookie-gif.PNG" class="hidden" alt="Baking">
          <img id="cookie-done" src="images/done-cookie.png" class="hidden" alt="Done Cookie">
        </div>

        <div id="timer-box">
          <div id="timer" class="frame timer-frame" role="timer" aria-live="off">10:00</div>
          <div id="done" class="frame timer-frame hidden">ENJOY!</div>
          <div id="status" class="frame" aria-live="polite">Ready to bake</div>
        </div>

        <div class="controls">
          <button id="bakeStart" class="img-btn" type="button">
            <img src="buttons/start.png" alt="Start">
          </button>
          <button id="bakeEnd" class="img-btn" type="button">
            <img src="buttons/reset.png" alt="Reset">
          </button>
        </div>

        <!-- Timer presets -->
        <div id="presets-panel" class="frame">
          <h2 class="panel-title">Bake time</h2>
          <div id="presets"></div>
          <form id="custom-form" class="hidden" autocomplete="off">
            <input id="customName" type="text" maxlength="16" placeholder="Name (optional)">
            <input id="customMin" type="number" min="0" max="180" placeholder="min" aria-label="Minutes">
            <span>:</span>
            <input id="customSec" type="number" min="0" max="59" placeholder="sec" aria-label="Seconds">
            <button id="customUse" class="icon-btn small" type="submit" title="Use this time once" aria-label="Use this time once">
              <img src="buttons/icons/check.png" alt="">
            </button>
            <button id="customSave" class="icon-btn small" type="button" title="Save as a preset" aria-label="Save as a preset">
              <img src="buttons/icons/save.png" alt="">
            </button>
            <div id="custom-error" class="hidden"></div>
          </form>
        </div>
      </section>

      <!-- Multiple timers: extra trays that count down on their own -->
      <aside id="trays" class="frame">
        <h2 class="panel-title">Extra trays</h2>
        <ul id="tray-list"></ul>
        <p id="tray-empty">Baking more than one batch?</p>
        <button id="addTray" class="text-btn frame" type="button">+ Add tray</button>
      </aside>
    </main>
  </div>
</body>


<script>
  // ==================== SETTINGS (saved in localStorage) ====================
  const STORE_KEY = 'cookieTimer.settings';

  const BUILT_IN_PRESETS = [
    { id: 'chewy',   name: 'Chewy',   seconds: 8 * 60 },
    { id: 'classic', name: 'Classic', seconds: 10 * 60 },
    { id: 'crispy',  name: 'Crispy',  seconds: 12 * 60 },
  ];

  const DEFAULT_SETTINGS = {
    duration: 600,          // last chosen bake time, in seconds
    presetId: 'classic',    // which preset chip is highlighted
    customPresets: [],      // [{ id, name, seconds }]
    sound: true,            // play a chime when a timer finishes
    notify: false,          // show a browser notification when a timer finishes
    theme: null,            // 'light' | 'dark' | null (follow the system)
  };

  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORE_KEY));
      return Object.assign({}, DEFAULT_SETTINGS, saved || {});
    } catch (e) {
      return Object.assign({}, DEFAULT_SETTINGS);
    }
  }

  function saveSettings() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(settings));
    } catch (e) { /* private mode or storage full: settings just won't persist */ }
  }

  const settings = loadSettings();

  // ==================== ICONS ====================
  function setIcon(button, name, label) {
    const img = button.querySelector('img');
    const src = `buttons/icons/${name}.png`;
    if (!img.getAttribute('src') || !img.src.endsWith(src)) img.src = src;
    button.title = label;
    button.setAttribute('aria-label', label);
  }

  function iconButton(name, label, action, small = true) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-btn' + (small ? ' small' : '');
    btn.innerHTML = '<img alt="">';
    if (action) btn.dataset.action = action;
    setIcon(btn, name, label);
    return btn;
  }

  // ==================== COUNTDOWN ====================
  // Counts against the clock instead of counting ticks, so it stays accurate
  // when the browser slows timers down in a background tab.
  class Countdown {
    constructor(seconds, onDone) {
      this.onDone = onDone;
      this.reset(seconds);
    }

    get running() { return this.endAt !== null; }
    get secondsLeft() { return Math.ceil(this.remainingMs / 1000); }
    get started() { return this.running || this.remainingMs < this.duration * 1000; }
    get paused() { return this.started && !this.running && !this.done; }

    start() {
      if (this.running || this.remainingMs <= 0) return;
      this.endAt = Date.now() + this.remainingMs;
    }

    pause() {
      if (!this.running) return;
      this.remainingMs = Math.max(0, this.endAt - Date.now());
      this.endAt = null;
    }

    reset(seconds = this.duration) {
      this.duration = seconds;
      this.remainingMs = seconds * 1000;
      this.endAt = null;
      this.done = false;
    }

    tick() {
      if (!this.running) return;
      this.remainingMs = Math.max(0, this.endAt - Date.now());
      if (this.remainingMs === 0) {
        this.endAt = null;
        this.done = true;
        this.onDone();
      }
    }
  }

  // Helper: Format seconds as MM:SS
  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
  }

  // ==================== SOUND ====================
  // A little 8-bit chime made with Web Audio, so there's no sound file to load.
  let audioCtx = null;

  function unlockAudio() {
    // Browsers only allow audio after a click, so this runs on every Start press.
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audioCtx) audioCtx = new Ctx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playChime() {
    if (!settings.sound || !audioCtx) return;
    const notes = [784, 988, 1175, 1568]; // G5 B5 D6 G6
    const step = 0.13;
    let t = audioCtx.currentTime + 0.05;
    for (let round = 0; round < 3; round++) {
      notes.forEach((freq) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + step * 0.95);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + step);
        t += step;
      });
      t += 0.35;
    }
  }

  // ==================== BROWSER NOTIFICATIONS ====================
  const canNotify = 'Notification' in window;

  function notify(title, body) {
    if (!settings.notify || !canNotify || Notification.permission !== 'granted') return;
    try {
      const n = new Notification(title, { body, icon: 'images/done-cookie.png' });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) { /* some mobile browsers only allow notifications from a service worker */ }
  }

  function alertDone(title, body) {
    playChime();
    notify(title, body);
  }

  // ==================== SETTINGS BAR ====================
  const soundToggle = document.getElementById('soundToggle');
  const notifyToggle = document.getElementById('notifyToggle');
  const themeToggle = document.getElementById('themeToggle');

  function isDark() {
    return document.documentElement.classList.contains('dark');
  }

  function renderSettingsBar() {
    setIcon(soundToggle, settings.sound ? 'sound' : 'sound-off',
      settings.sound ? 'Sound is on (click to mute)' : 'Sound is off (click to turn on)');
    soundToggle.setAttribute('aria-pressed', settings.sound);

    if (!canNotify) {
      notifyToggle.classList.add('hidden');
    } else if (Notification.permission === 'denied') {
      setIcon(notifyToggle, 'bell-off', 'Notifications are blocked in your browser settings');
      notifyToggle.setAttribute('aria-pressed', false);
    } else {
      const on = settings.notify && Notification.permission === 'granted';
      setIcon(notifyToggle, on ? 'bell' : 'bell-off',
        on ? 'Notifications are on (click to turn off)' : 'Notify me when cookies are ready');
      notifyToggle.setAttribute('aria-pressed', on);
    }

    setIcon(themeToggle, isDark() ? 'sun' : 'moon', isDark() ? 'Switch to light mode' : 'Switch to dark mode');
  }

  soundToggle.addEventListener('click', () => {
    settings.sound = !settings.sound;
    saveSettings();
    renderSettingsBar();
    if (settings.sound) { unlockAudio(); }
  });

  notifyToggle.addEventListener('click', async () => {
    if (!canNotify || Notification.permission === 'denied') return;
    if (settings.notify && Notification.permission === 'granted') {
      settings.notify = false;
    } else {
      const result = Notification.permission === 'granted'
        ? 'granted'
        : await Notification.requestPermission();
      settings.notify = result === 'granted';
    }
    saveSettings();
    renderSettingsBar();
  });

  themeToggle.addEventListener('click', () => {
    const dark = !isDark();
    document.documentElement.classList.toggle('dark', dark);
    settings.theme = dark ? 'dark' : 'light';
    saveSettings();
    renderSettingsBar();
  });

  // Follow the system theme live, until the user picks one themselves.
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (settings.theme) return;
      document.documentElement.classList.toggle('dark', e.matches);
      renderSettingsBar();
    });
  }

  // ==================== MAIN COOKIE TIMER ====================
  const cookieDough = document.getElementById('cookie-dough');
  const cookieBaking = document.getElementById('cookie-baking');
  const cookieDone = document.getElementById('cookie-done');
  const bakeStart = document.getElementById('bakeStart');
  const bakeStartImg = bakeStart.querySelector('img');
  const bakeEnd = document.getElementById('bakeEnd');
  const timerDisplay = document.getElementById('timer');
  const doneMsg = document.getElementById('done');
  const statusEl = document.getElementById('status');

  const BAKING_GIF = 'images/cookie-gif.PNG';
  const BAKING_STILL = 'images/cookie-baking-still.png'; // one frame, shown while stopped

  const mainTimer = new Countdown(settings.duration, () => {
    renderMain();
    alertDone('Your cookies are ready! 🍪', `${currentPresetName()} batch is done baking.`);
  });

  function setSrc(img, src) {
    if (!img.src.endsWith(src)) img.src = src;
  }

  function renderMain() {
    const t = mainTimer;
    const idle = !t.started && !t.done;

    cookieDough.classList.toggle('hidden', !idle);
    cookieBaking.classList.toggle('hidden', idle || t.done);
    cookieDone.classList.toggle('hidden', !t.done);
    // Freeze the cookie when stopped, so it's clear nothing is baking.
    setSrc(cookieBaking, t.paused ? BAKING_STILL : BAKING_GIF);

    timerDisplay.textContent = formatTime(t.secondsLeft);
    timerDisplay.classList.toggle('hidden', t.done);
    timerDisplay.classList.toggle('paused', t.paused);
    doneMsg.classList.toggle('hidden', !t.done);

    statusEl.textContent = t.done ? 'Cookies are ready'
      : t.running ? `Baking · ${currentPresetName()}`
      : t.paused ? 'Stopped'
      : `Ready · ${currentPresetName()}`;

    // Start becomes Stop while baking, so the same spot stops and resumes.
    setSrc(bakeStartImg, t.running ? 'buttons/stop.png' : 'buttons/start.png');
    bakeStartImg.alt = t.running ? 'Stop' : (t.paused ? 'Resume' : 'Start');

    // Changing the bake time mid-bake would be confusing, so lock presets while it runs.
    document.querySelectorAll('#presets button, #custom-form button').forEach((b) => {
      b.disabled = t.running;
    });

    updateTitle();
  }

  // Start / Stop / Resume. pointerdown would fire twice with click on some phones,
  // so only click is used, and the handler reads the state once.
  bakeStart.addEventListener('click', (e) => {
    e.preventDefault();
    unlockAudio();
    if (mainTimer.running) {
      mainTimer.pause();
    } else {
      if (mainTimer.done) mainTimer.reset();
      mainTimer.start();
    }
    renderMain();
  });

  // Reset/stop baking
  bakeEnd.addEventListener('click', (e) => {
    e.preventDefault();
    resetTimer();
  });

  function resetTimer() {
    mainTimer.reset(settings.duration);
    renderMain();
  }

  function updateTitle() {
    const t = mainTimer;
    if (t.done) document.title = 'Cookies ready! 🍪';
    else if (t.running) document.title = `${formatTime(t.secondsLeft)} · Baking`;
    else if (t.paused) document.title = `${formatTime(t.secondsLeft)} · Stopped`;
    else document.title = 'Baking Timer';
  }

  // ==================== PRESETS ====================
  const presetsEl = document.getElementById('presets');
  const customForm = document.getElementById('custom-form');
  const customName = document.getElementById('customName');
  const customMin = document.getElementById('customMin');
  const customSec = document.getElementById('customSec');
  const customSave = document.getElementById('customSave');
  const customError = document.getElementById('custom-error');

  function allPresets() {
    return BUILT_IN_PRESETS.concat(settings.customPresets);
  }

  function currentPresetName() {
    const p = allPresets().find((x) => x.id === settings.presetId);
    return p ? p.name : 'Custom';
  }

  function chooseDuration(seconds, presetId) {
    settings.duration = seconds;
    settings.presetId = presetId;
    saveSettings();
    mainTimer.reset(seconds);
    renderPresets();
    renderMain();
  }

  function chip(text, selected) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'text-btn frame' + (selected ? ' selected' : '');
    btn.textContent = text;
    return btn;
  }

  function renderPresets() {
    presetsEl.innerHTML = '';

    allPresets().forEach((p) => {
      const wrap = document.createElement('span');
      wrap.className = 'preset';

      const btn = chip(`${p.name} ${formatTime(p.seconds)}`, p.id === settings.presetId);
      btn.addEventListener('click', () => chooseDuration(p.seconds, p.id));
      wrap.appendChild(btn);

      if (p.id.startsWith('custom-')) {
        const del = iconButton('remove', `Delete "${p.name}" preset`);
        del.addEventListener('click', () => {
          settings.customPresets = settings.customPresets.filter((x) => x.id !== p.id);
          if (settings.presetId === p.id) settings.presetId = null;
          saveSettings();
          renderPresets();
          renderMain();
        });
        wrap.appendChild(del);
      }

      presetsEl.appendChild(wrap);
    });

    // A custom time that wasn't saved as a preset still gets a highlighted chip.
    const isCustomTime = !allPresets().some((p) => p.id === settings.presetId);
    const customChip = chip(isCustomTime ? `Custom ${formatTime(settings.duration)}` : '+ Custom', isCustomTime);
    customChip.id = 'customChip';
    customChip.addEventListener('click', () => {
      customForm.classList.toggle('hidden');
      if (!customForm.classList.contains('hidden')) {
        customMin.value = Math.floor(settings.duration / 60);
        customSec.value = settings.duration % 60;
        customMin.focus();
      }
    });
    presetsEl.appendChild(customChip);
  }

  function readCustomSeconds() {
    const min = parseInt(customMin.value || '0', 10);
    const sec = parseInt(customSec.value || '0', 10);
    if (isNaN(min) || isNaN(sec) || min < 0 || sec < 0 || sec > 59 || min > 180) {
      return showCustomError('Use 0–180 minutes and 0–59 seconds.');
    }
    const total = min * 60 + sec;
    if (total < 1) return showCustomError('Pick at least 1 second.');
    customError.classList.add('hidden');
    return total;
  }

  function showCustomError(msg) {
    customError.textContent = msg;
    customError.classList.remove('hidden');
    return null;
  }

  // The check button applies the time once without saving it as a preset.
  customForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const total = readCustomSeconds();
    if (total === null) return;
    chooseDuration(total, null);
    customForm.classList.add('hidden');
  });

  customSave.addEventListener('click', () => {
    const total = readCustomSeconds();
    if (total === null) return;
    const name = customName.value.trim() || `My ${formatTime(total)}`;
    const preset = { id: `custom-${Date.now()}`, name, seconds: total };
    settings.customPresets.push(preset);
    customName.value = '';
    customForm.classList.add('hidden');
    chooseDuration(total, preset.id);
  });

  // ==================== EXTRA TRAYS (multiple timers) ====================
  const trayList = document.getElementById('tray-list');
  const trayEmpty = document.getElementById('tray-empty');
  const addTrayBtn = document.getElementById('addTray');
  const trays = [];
  let trayCount = 1; // tray 1 is the big cookie

  function addTray() {
    trayCount++;
    const name = `Tray ${trayCount} · ${currentPresetName()}`;

    const li = document.createElement('li');
    li.className = 'tray';
    li.innerHTML = `
      <span class="tray-name"></span>
      <span class="tray-time frame timer-frame"></span>
      <div class="tray-actions"></div>`;
    li.querySelector('.tray-name').textContent = name;
    li.querySelector('.tray-name').title = name;

    const actions = li.querySelector('.tray-actions');
    actions.append(
      iconButton('play', 'Start', 'toggle'),
      iconButton('reset', 'Reset', 'reset'),
      iconButton('remove', 'Remove tray', 'remove'),
    );

    const tray = { name, el: li, timer: null };
    tray.timer = new Countdown(settings.duration, () => {
      renderTray(tray);
      alertDone(`${name} is ready! 🍪`, 'Take this tray out of the oven.');
    });

    li.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'toggle') {
        unlockAudio();
        if (tray.timer.running) tray.timer.pause();
        else {
          if (tray.timer.done) tray.timer.reset();
          tray.timer.start();
        }
      } else if (action === 'reset') {
        tray.timer.reset();
      } else if (action === 'remove') {
        trays.splice(trays.indexOf(tray), 1);
        li.remove();
        trayEmpty.classList.toggle('hidden', trays.length > 0);
        return;
      }
      renderTray(tray);
    });

    trays.push(tray);
    trayList.appendChild(li);
    trayEmpty.classList.add('hidden');
    renderTray(tray);
  }

  function renderTray(tray) {
    const t = tray.timer;
    tray.el.classList.toggle('is-done', t.done);
    tray.el.querySelector('.tray-time').textContent = t.done ? 'READY!' : formatTime(t.secondsLeft);
    setIcon(tray.el.querySelector('[data-action="toggle"]'),
      t.running ? 'pause' : 'play',
      t.running ? 'Stop' : (t.paused ? 'Resume' : 'Start'));
  }

  addTrayBtn.addEventListener('click', addTray);

  // ==================== TICK ====================
  // One loop drives every timer. It runs often so the display never lags a second behind.
  setInterval(() => {
    if (mainTimer.running) {
      mainTimer.tick();
      renderMain();
    }
    trays.forEach((tray) => {
      if (tray.timer.running) {
        tray.timer.tick();
        renderTray(tray);
      }
    });
  }, 250);

  // Warn before leaving the page while something is still baking.
  window.addEventListener('beforeunload', (e) => {
    if (mainTimer.running || trays.some((t) => t.timer.running)) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // Pre-load images that get swapped in, so changes are instant
  ['images/background_2.png', 'buttons/stop.png', BAKING_STILL, 'buttons/icons/pause.png']
    .forEach((src) => { new Image().src = src; });

  // Back button - go to start screen
  document.getElementById('backBtn').addEventListener('click', () => {
      mainTimer.pause();
      trays.forEach((t) => t.timer.pause());
      window.location.href = 'index.html';
    });

  // First paint
  renderSettingsBar();
  renderPresets();
  renderMain();

  </script>

</html>
