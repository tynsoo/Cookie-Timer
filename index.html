<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chocolate-chip Bake Timer</title>
  <link href="fonts/fonts.css" rel="stylesheet">
  <script>
    // Apply the saved theme before the page paints (shared with the bake page).
    (function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem('cookieTimer.settings')) || {}; } catch (e) {}
      var dark = s.theme ? s.theme === 'dark'
        : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}

body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  margin: 0;
  padding: 0;
  font-family: 'Silkscreen', monospace;
}

/* ==================== START SCREEN ==================== */

#start-screen {
  position: relative;
  width: 100%;
  height: 100%;
  background-color: #8b4545;
  
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; /* start from top, not center */
  gap: 1vh; /* space between title and button */
  padding-top: 20vh; /* move the title down without affecting button */
}

#start-title {
  font-size: 8vw;
  color: #fff;
  text-shadow: 4px 4px #000;
  letter-spacing: 0;
  font-weight: bold;
  z-index: 2;
  text-align: center;      /* center the text */
  width: 100%;   
}

#start-screen-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  image-rendering: pixelated;
  z-index: 0;
}

#startBtn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  z-index: 2; /* button above background */
}

#start-button-img {
  width: 50vw; /* responsive width */
  max-width: 500px;
  height: auto;
  image-rendering: pixelated;
  transition: transform 0.2s ease;
}

#start-button-img:hover {
  transform: scale(1.1);
}

/* ==================== DARK MODE ==================== */

#start-screen::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(20, 8, 12, 0.62);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 1;
}

html.dark #start-screen::after {
  opacity: 1;
}

html.dark #start-button-img {
  filter: brightness(0.88);
}

#themeToggle {
  position: absolute;
  top: 18px;
  right: 18px;
  z-index: 3;
  background: none;
  border: none;
  padding: 0;
  line-height: 0;
  cursor: pointer;
  transition: transform 0.2s ease;
}

#themeToggle:hover {
  transform: scale(1.1);
}

#themeToggle img {
  width: 51px;
  height: 48px;
  image-rendering: pixelated;
}

html.dark #themeToggle img {
  filter: brightness(0.85);
}

/* MEDIA QUERIES */
@media screen and (max-width: 768px) {
  #start-title {
    font-size: 10vw;
  }

  #start-button-img {
    width: 60vw;
    max-width: 300px;
  }
}

@media screen and (max-width: 480px) {
  #start-title {
    font-size: 11vw;
  }

  #start-button-img {
    width: 70vw;
    max-width: 250px;
  }
}

</style>

<body>

  <div id="start-screen">
    <img id="start-screen-bg" src="images/start_background.png">
    <button id="themeToggle" type="button"><img alt=""></button>
    <h1 id="start-title">Cookie timer</h1>
    <a id="startBtn" href="bake.html">
      <img id="start-button-img" src="buttons/lets-bake.png" alt="Start Baking">
    </a>    
</div>

  <script>
    // Dark mode toggle, saved alongside the timer settings.
    (function () {
      var KEY = 'cookieTimer.settings';
      var btn = document.getElementById('themeToggle');
      var root = document.documentElement;
      function label() {
        var dark = root.classList.contains('dark');
        btn.querySelector('img').src = 'buttons/icons/' + (dark ? 'sun' : 'moon') + '.png';
        btn.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
        btn.setAttribute('aria-label', btn.title);
      }
      btn.addEventListener('click', function () {
        var dark = !root.classList.contains('dark');
        root.classList.toggle('dark', dark);
        var s = {};
        try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
        s.theme = dark ? 'dark' : 'light';
        try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
        label();
      });
      label();
    })();
  </script>
</body>

</html>
